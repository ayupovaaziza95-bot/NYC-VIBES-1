      font-size: 24px;
      margin: 0;

      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;

      display: flex;
      flex-direction: column;

      left: 12px;

      font-weight: 700;
      font-size: 12px;

    // Инициализация карты (OpenStreetMap без ключей)
    const map = L.map("map").setView([40.75, -73.985], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let markerLayer = L.layerGroup().addTo(map);
    let routeLine = null;
    let selectedDay = 1;
    let miniMap = null;

    const buttons = document.getElementById("dayButtons");
    const places = document.getElementById("places");
    const dayBanner = document.getElementById("dayBanner");

    function renderDays() {
      buttons.innerHTML = "";
      for (let day = 1; day <= 4; day++) {
        const button = document.createElement("button");
        button.className = "day-btn" + (day === selectedDay ? " active" : "");
        button.innerHTML = `День ${day}`;
        button.onclick = () => { selectedDay = day; renderDays(); renderPlaces(); };
        buttons.appendChild(button);
      }
    }

    function renderPlaces() {
      const items = attractions.filter(a => a.day === selectedDay);
      const info = dayInfo[selectedDay];

      dayBanner.innerHTML = `
        <div>
          <h2>${info.title}</h2>
          <p style="color: #94a3b8; font-size: 14px;">${info.summary}</p>
        </div>
        <div class="day-meta">
          <span class="meta-tag">🚶 ${info.distance}</span>
          <span class="meta-tag">🚇 ${info.transport}</span>
        </div>
      `;

      places.innerHTML = "";
      markerLayer.clearLayers();
      if (routeLine) map.removeLayer(routeLine);

      const routePoints = [];

      items.forEach((item) => {
        const card = document.createElement("article");
        card.className = "place-card";
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${item.image}" alt="${item.name}" loading="lazy">
            <span class="step-badge">#${item.step}</span>
            ${item.audioFile ? `<span class="audio-badge">🎧 Аудио</span>` : ""}
          </div>
          <div class="card-body">
            <div class="card-area">${item.area}</div>
            <h3 class="card-title">${item.name}</h3>
            <p class="card-desc">${item.description}</p>
            <div class="card-footer">
              <span class="card-time">⏱ ${item.visitTime}</span>
              <button class="btn-open" onclick="openObjectPage('${item.id}')">Открыть →</button>
            </div>
          </div>
        `;
        card.onclick = () => openObjectPage(item.id);
        places.appendChild(card);

        const customIcon = L.divIcon({
          className: "custom-pin",
          html: `<div style="background:#f43f5e;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.4);">${item.step}</div>`,
          iconSize: [26, 26], iconAnchor: [13, 13]
        });

        L.marker([item.lat, item.lng], { icon: customIcon }).addTo(markerLayer);
        routePoints.push([item.lat, item.lng]);
      });

      if (routePoints.length > 1) {
        routeLine = L.polyline(routePoints, { color: "#f43f5e", weight: 4, opacity: 0.85, dashArray: "6, 6" }).addTo(map);
        map.fitBounds(routeLine.getBounds(), { padding: [35, 35] });
      }
    }

    function openObjectPage(id) {
      const item = attractions.find(a => a.id === id);
      if (!item) return;

      document.getElementById("detailImg").src = item.image;
      document.getElementById("detailTitle").textContent = item.name;
      document.getElementById("detailSubtitle").textContent = `${item.area} • Остановка #${item.step} • ⏱ ${item.visitTime}`;
      document.getElementById("detailDescription").textContent = item.description;
      document.getElementById("detailFact").textContent = item.fact;
      document.getElementById("detailAddress").textContent = item.address;
      document.getElementById("detailPrice").textContent = item.price;
      document.getElementById("detailHours").textContent = item.hours;
      
      const urlEl = document.getElementById("detailUrl");
      urlEl.href = item.url;
      urlEl.textContent = item.url === "#" ? "Официальный сайт" : item.url;

      // Настройка MP3 аудиоплеера
      const audioBox = document.getElementById("audioPlayerBox");
      const audioElement = document.getElementById("audioElement");
      const audioSource = document.getElementById("audioSource");
      const audioDescText = document.getElementById("audioDescText");

      if (item.audioFile) {
        audioBox.style.display = "block";
        audioSource.src = item.audioFile;
        audioElement.load(); // перезагружаем аудиофайл
        audioDescText.textContent = item.audioText || "Прослушайте аудиогид по этой локации";
      } else {
        audioBox.style.display = "none";
        audioElement.pause();
      }

      document.getElementById("homePage").style.display = "none";
      document.getElementById("detailPage").style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });

      setTimeout(() => {
        if (miniMap) miniMap.remove();
        miniMap = L.map("miniMap").setView([item.lat, item.lng], 15);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(miniMap);
        L.marker([item.lat, item.lng]).addTo(miniMap);
      }, 100);
    }

    function goHome() {
      // Останавливаем аудио при возврате
      const audioElement = document.getElementById("audioElement");
      if (audioElement) audioElement.pause();

      document.getElementById("detailPage").style.display = "none";
      document.getElementById("homePage").style.display = "block";
      map.invalidateSize();
    }

    renderDays();
    renderPlaces();
  </script>
</body>
</html>
